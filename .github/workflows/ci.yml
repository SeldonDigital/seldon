name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job runs a root script, and `npm run check` runs the same five in order.
# A contributor can reproduce a red job with one command, and adding a workspace
# needs no edit here, because the lint and typecheck scripts fan out over
# whatever the root package.json lists.
jobs:
  format:
    name: Format (Prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npm run format:check

  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npm run lint:all

  typecheck:
    name: Type-check (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      # Bundle packages typecheck against the built d.ts of core/factory/ai, so
      # their dist must exist before the workspace typecheck fans out.
      - run: npm run build:packages
      - run: npm run typecheck:all

  bindings:
    name: Bindings (drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      # Runs the emitted scanner, the same file any consuming project runs, so a
      # committed manifest cannot fall behind the code that drives the refs.
      - run: npm run bindings:check

  test:
    name: Unit tests (core, factory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npm test
